{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto w-full">
    <div class="bg-white dark:bg-zinc-800/80 border border-slate-200 dark:border-zinc-700/50 rounded-2xl shadow-sm p-6 sm:p-8">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">New Study Session</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Input the topic you studied today to generate your spaced repetition schedule.</p>
        </div>

        <form action="{{ url_for('add_topic') }}" method="POST" class="space-y-6">
            
            <div class="space-y-2">
                <label for="track" class="block text-sm font-medium text-slate-700 dark:text-zinc-300">Track</label>
                <select name="track" id="track" required onchange="updateSubjects()"
                    class="block w-full rounded-lg border-slate-300 dark:border-zinc-600 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white px-4 py-3 focus:border-primary-500 focus:ring-primary-500 sm:text-sm transition-colors outline-none border focus:ring-2 focus:ring-opacity-20 shadow-sm">
                    <option value="" disabled selected>Select School or Allen...</option>
                    {% for track_name in subject_sets.keys() %}
                    <option value="{{ track_name }}">{{ track_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="space-y-2">
                <label for="subject" class="block text-sm font-medium text-slate-700 dark:text-zinc-300">Subject</label>
                <select name="subject" id="subject" required
                    class="block w-full rounded-lg border-slate-300 dark:border-zinc-600 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white px-4 py-3 focus:border-primary-500 focus:ring-primary-500 sm:text-sm transition-colors outline-none border focus:ring-2 focus:ring-opacity-20 shadow-sm">
                    <option value="" disabled selected>Select a track first...</option>
                </select>
            </div>

            <div class="space-y-2">
                <label for="topic_name" class="block text-sm font-medium text-slate-700 dark:text-zinc-300">Topic Details</label>
                <input type="text" name="topic_name" id="topic_name" required placeholder="e.g. World War II, Calculus Derivation" 
                    class="block w-full rounded-lg border-slate-300 dark:border-zinc-600 bg-white dark:bg-zinc-900 text-slate-900 dark:text-white px-4 py-3 placeholder-slate-400 dark:placeholder-zinc-500 focus:border-primary-500 focus:ring-primary-500 sm:text-sm transition-colors outline-none border focus:ring-2 focus:ring-opacity-20 shadow-sm">
            </div>

            <div class="space-y-3">
                <label class="block text-sm font-medium text-slate-700 dark:text-zinc-300">Self-Assessed Difficulty</label>
                <div class="grid grid-cols-3 gap-3">
                    
                    <label class="cursor-pointer relative">
                        <input type="radio" name="difficulty" value="Easy" class="peer sr-only" required>
                        <div class="rounded-lg border px-3 py-3 text-center border-slate-200 dark:border-zinc-600 hover:bg-slate-50 dark:hover:bg-zinc-700/50 peer-checked:border-green-500 peer-checked:bg-green-50 dark:peer-checked:bg-green-900/20 peer-checked:text-green-700 dark:peer-checked:text-green-400 transition-all shadow-sm group">
                            <span class="block text-sm font-semibold">Easy</span>
                        </div>
                    </label>

                    <label class="cursor-pointer relative">
                        <input type="radio" name="difficulty" value="Medium" class="peer sr-only" checked>
                        <div class="rounded-lg border px-3 py-3 text-center border-slate-200 dark:border-zinc-600 hover:bg-slate-50 dark:hover:bg-zinc-700/50 peer-checked:border-yellow-500 peer-checked:bg-yellow-50 dark:peer-checked:bg-yellow-900/20 peer-checked:text-yellow-700 dark:peer-checked:text-yellow-400 transition-all shadow-sm group">
                            <span class="block text-sm font-semibold">Medium</span>
                        </div>
                    </label>

                    <label class="cursor-pointer relative">
                        <input type="radio" name="difficulty" value="Hard" class="peer sr-only">
                        <div class="rounded-lg border px-3 py-3 text-center border-slate-200 dark:border-zinc-600 hover:bg-slate-50 dark:hover:bg-zinc-700/50 peer-checked:border-red-500 peer-checked:bg-red-50 dark:peer-checked:bg-red-900/20 peer-checked:text-red-700 dark:peer-checked:text-red-400 transition-all shadow-sm group">
                            <span class="block text-sm font-semibold">Hard</span>
                        </div>
                    </label>

                </div>
                <p class="text-xs text-slate-500 dark:text-zinc-400 mt-2">Intervals adapt based on difficulty. Harder tasks are reviewed sooner.</p>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors shadow-primary-500/20">
                    Map Tracking Schedule
                </button>
            </div>
            
        </form>
    </div>
</div>

<script>
const subjectSets = {{ subject_sets | tojson }};

function updateSubjects() {
    const trackSelect = document.getElementById('track');
    const subjectSelect = document.getElementById('subject');
    const selectedTrack = trackSelect.value;

    subjectSelect.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.disabled = true;
    placeholder.selected = true;
    placeholder.textContent = selectedTrack ? 'Select a subject...' : 'Select a track first...';
    subjectSelect.appendChild(placeholder);

    if (!selectedTrack || !subjectSets[selectedTrack]) {
        return;
    }

    subjectSets[selectedTrack].forEach((subject) => {
        const option = document.createElement('option');
        option.value = subject;
        option.textContent = subject;
        subjectSelect.appendChild(option);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('track').value) {
        updateSubjects();
    }
});
</script>

{% endblock %}
